[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-motion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "opencv-python-headless>=4.10,<5"]

[project.scripts]
ui-motion = "app.cli:main"

[tool.setuptools]
packages = ["app"]
